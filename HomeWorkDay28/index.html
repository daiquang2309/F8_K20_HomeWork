<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cửa hàng sản phẩm</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                font-family: "Segoe UI", Roboto, Arial, sans-serif;
            }
            .product-card {
                transition:
                    transform 0.15s ease,
                    box-shadow 0.15s ease;
            }
            .product-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.25);
            }
            .btn {
                transition:
                    background-color 0.15s ease,
                    transform 0.15s ease,
                    opacity 0.15s ease;
            }
            .btn:hover:not(:disabled) {
                transform: translateY(-1px);
            }
            .btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .spinner {
                border: 4px solid #e2e8f0;
                border-top: 4px solid #4f46e5;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body class="bg-slate-50 min-h-screen text-slate-800">
        <!-- Header -->
        <header class="bg-indigo-700 text-white shadow">
            <div class="max-w-6xl mx-auto px-4 py-4">
                <h1 class="text-xl sm:text-2xl font-bold">Cửa hàng sản phẩm</h1>
                <p class="text-indigo-100 text-sm">Dữ liệu lấy từ dummyjson.com/products</p>
            </div>
        </header>

        <main class="max-w-6xl mx-auto px-4 py-6">
            <!-- Thanh công cụ: search / filter / sort -->
            <div class="bg-white rounded-xl shadow p-4 mb-6 grid grid-cols-1 md:grid-cols-4 gap-3">
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Tìm kiếm sản phẩm</label>
                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Nhập tên sản phẩm..."
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Danh mục</label>
                    <select
                        id="categorySelect"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                        <option value="">Tất cả danh mục</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Sắp xếp</label>
                    <select
                        id="sortSelect"
                        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                        <option value="">Mặc định</option>
                        <option value="title-asc">Tên: A → Z</option>
                        <option value="title-desc">Tên: Z → A</option>
                        <option value="price-asc">Giá: Thấp → Cao</option>
                        <option value="price-desc">Giá: Cao → Thấp</option>
                    </select>
                </div>
            </div>

            <!-- Trạng thái -->
            <div id="loadingState" class="hidden flex-col items-center justify-center py-16">
                <div class="spinner mb-3"></div>
                <p class="text-slate-500 text-sm">Đang tải sản phẩm...</p>
            </div>

            <div id="errorState" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-6 text-center">
                <p class="font-semibold mb-1">Đã xảy ra lỗi</p>
                <p id="errorMessage" class="text-sm">Không thể tải dữ liệu sản phẩm.</p>
            </div>

            <div
                id="emptyState"
                class="hidden bg-slate-100 border border-slate-200 text-slate-500 rounded-xl p-10 text-center"
            >
                <p class="font-semibold">Không tìm thấy sản phẩm phù hợp</p>
                <p class="text-sm mt-1">Hãy thử từ khóa hoặc bộ lọc khác.</p>
            </div>

            <!-- Grid sản phẩm -->
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

            <!-- Pagination -->
            <div
                id="paginationBar"
                class="hidden mt-8 flex flex-wrap items-center justify-between gap-3 bg-white rounded-xl shadow p-4"
            >
                <p id="pageInfo" class="text-sm text-slate-500"></p>
                <div class="flex items-center gap-2">
                    <button
                        id="prevBtn"
                        class="btn bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg text-sm font-medium"
                    >
                        ← Trước
                    </button>
                    <span id="pageNumber" class="text-sm font-semibold px-2"></span>
                    <button
                        id="nextBtn"
                        class="btn bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg text-sm font-medium"
                    >
                        Sau →
                    </button>
                </div>
            </div>
        </main>

        <script src="app.js"></script>
    </body>
</html>
