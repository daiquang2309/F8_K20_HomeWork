        <meta charset="UTF-8" />

    <body>
        <h1>Bài 2</h1>

        <a href="index.html">Quay lại</a>

        <script>
            const students = [
                { id: 1, name: "Khoa Nguyen" },
                { id: 2, name: "My Tran" },
                { id: 3, name: "Phong Le" },
                { id: 4, name: "Yen Vo" },
                { id: 5, name: "Bao Pham" },
            ];

            const answerKey = [
                { question: 1, correctAnswer: "A", point: 2 },
                { question: 2, correctAnswer: "C", point: 1 },
                { question: 3, correctAnswer: "B", point: 3 },
                { question: 4, correctAnswer: "D", point: 2 },
                { question: 5, correctAnswer: "A", point: 2 },
            ];

            const submissions = [
                {
                    studentId: 1,
                    submittedAt: "2026-07-10T08:00:00",
                    answers: [
                        { question: 1, answer: "A" },
                        { question: 2, answer: "C" },
                        { question: 3, answer: "B" },
                        { question: 4, answer: "A" },
                        { question: 5, answer: "A" },
                    ],
                },
                {
                    studentId: 2,
                    submittedAt: "2026-07-10T08:05:00",
                    answers: [
                        { question: 1, answer: "A" },
                        { question: 2, answer: "B" },
                        { question: 3, answer: "B" },
                        { question: 4, answer: "D" },
                        { question: 5, answer: "C" },
                    ],
                },
                {
                    studentId: 3,
                    submittedAt: "2026-07-10T07:58:00",
                    answers: [
                        { question: 1, answer: "A" },
                        { question: 2, answer: "C" },
                        { question: 3, answer: "B" },
                        { question: 4, answer: "D" },
                        { question: 5, answer: "A" },
                    ],
                },
                {
                    studentId: 4,
                    submittedAt: "2026-07-10T08:02:00",
                    answers: [
                        { question: 1, answer: "B" },
                        { question: 2, answer: "C" },
                    ],
                },
                {
                    studentId: 5,
                    submittedAt: "2026-07-10T08:01:00",
                    answers: [
                        { question: 1, answer: "A" },
                        { question: 2, answer: "C" },
                        { question: 3, answer: "B" },
                        { question: 4, answer: "D" },
                        { question: 5, answer: "A" },
                    ],
                },
            ];

            function gradeExam(students, answerKey, submissions) {
                const answerMap = new Map();

                for (const question of answerKey) {
                    answerMap.set(question.question, question);
                }

                const result = [];

                for (const student of students) {
                    let submission = null;

                    for (const item of submissions) {
                        if (item.studentId === student.id) {
                            submission = item;
                            break;
                        }
                    }

                    let score = 0;
                    let correctCount = 0;
                    const wrongQuestions = [];

                    if (submission && Object.hasOwn(submission, "answers")) {
                        const answerMapStudent = new Map();

                        for (const answer of submission.answers) {
                            answerMapStudent.set(answer.question, answer.answer);
                        }

                        for (const question of answerKey) {
                            if (
                                answerMapStudent.has(question.question) &&
                                answerMapStudent.get(question.question) === question.correctAnswer
                            ) {
                                score += question.point;
                                correctCount++;
                            } else {
                                wrongQuestions.push(question.question);
                            }
                        }
                    } else {
                        for (const question of answerKey) {
                            wrongQuestions.push(question.question);
                        }
                    }

                    wrongQuestions.sort((a, b) => a - b);

                    const studentResult = {
                        id: student.id,
                        name: student.name,
                        score,
                        correctCount,
                        wrongQuestions,
                        rank: 0,
                        submittedAt: submission ? submission.submittedAt : null,
                    };

                    Object.keys(studentResult).forEach((key) => {
                        Object.defineProperty(studentResult, key, {
                            writable: false,
                            configurable: false,
                        });
                    });

                    result.push(studentResult);
                }

                result.sort((a, b) => {
                    if (b.score !== a.score) {
                        return b.score - a.score;
                    }

                    if (a.submittedAt === null) return 1;
                    if (b.submittedAt === null) return -1;

                    return new Date(a.submittedAt) - new Date(b.submittedAt);
                });

                let rank = 1;

                for (let i = 0; i < result.length; i++) {
                    if (i > 0 && result[i].score === result[i - 1].score) {
                        result[i].rank = result[i - 1].rank;
                    } else {
                        rank = i + 1;
                        result[i].rank = rank;
                    }

                    delete result[i].submittedAt;
                }

                return result;
            }

            class WrongAnswerIterator {
                constructor(studentResult) {
                    this.wrongQuestions = studentResult.wrongQuestions;
                }

                *[Symbol.iterator]() {
                    for (const question of this.wrongQuestions) {
                        yield question;
                    }
                }
            }

            const result = gradeExam(students, answerKey, submissions);

            console.log(result);

            // Test Case 1
            const result_TC1 = gradeExam(students, answerKey, submissions);

            console.log({
                score: result_TC1[3].score,
                correctCount: result_TC1[3].correctCount,
                wrongQuestions: result_TC1[3].wrongQuestions,
            });
            // Test Case 2
            const result_TC2 = gradeExam(students, answerKey, submissions);

            console.log(result_TC2[3].wrongQuestions);
            // Test Case 3
            const result_TC3 = gradeExam(students, answerKey, submissions);

            console.log({
                score: result_TC3[4].score,
                correctCount: result_TC3[4].correctCount,
                wrongQuestions: result_TC3[4].wrongQuestions,
            });
            // Test Case 4
            const result_TC4 = gradeExam(students, answerKey, submissions);

            result_TC4.forEach((student) => {
                console.log(`${student.name}: Rank ${student.rank}`);
            });
            // Test Case 5
            const students_TC5 = [
                { id: 1, name: "Khoa" },
                { id: 2, name: "Yen" },
                { id: 3, name: "Phong" },
            ];

            const answerKey_TC5 = [
                { question: 1, correctAnswer: "A", point: 2 },
                { question: 2, correctAnswer: "B", point: 2 },
                { question: 3, correctAnswer: "C", point: 2 },
                { question: 4, correctAnswer: "D", point: 2 },
                { question: 5, correctAnswer: "A", point: 2 },
            ];

            const submissions_TC5 = [
                {
                    studentId: 1,
                    submittedAt: "2026-07-10T08:00:00",
                    answers: [
                        { question: 1, answer: "A" },
                        { question: 2, answer: "B" },
                        { question: 3, answer: "C" },
                        { question: 4, answer: "D" },
                        { question: 5, answer: "A" },
                    ],
                },
                {
                    studentId: 2,
                    submittedAt: "2026-07-10T08:01:00",
                    answers: [
                        { question: 1, answer: "A" },
                        { question: 2, answer: "B" },
                        { question: 3, answer: "C" },
                        { question: 4, answer: "D" },
                        { question: 5, answer: "A" },
                    ],
                },
                {
                    studentId: 3,
                    submittedAt: "2026-07-10T07:58:00",
                    answers: [
                        { question: 1, answer: "A" },
                        { question: 2, answer: "B" },
                        { question: 3, answer: "C" },
                        { question: 4, answer: "D" },
                        { question: 5, answer: "A" },
                    ],
                },
            ];

            const result_TC5 = gradeExam(students_TC5, answerKey_TC5, submissions_TC5);

            result_TC5.forEach((student) => {
                console.log(student.name);
            });
            // Test Case 6
            const result_TC6 = gradeExam(students, answerKey, submissions);

            result_TC6.forEach((student) => {
                console.log(`${student.name}: Rank ${student.rank}`);
            });
            // Test Case 7
            const brokenSubmission = Object.create({
                answers: [{ question: 1, answer: "A" }],
            });

            brokenSubmission.studentId = 2;
            brokenSubmission.submittedAt = "2026-07-10T08:05:00";

            const newSubmissions = submissions.map((submission) =>
                submission.studentId === 2 ? brokenSubmission : submission,
            );

            const result_TC7 = gradeExam(students, answerKey, newSubmissions);

            console.log(result_TC7.find((student) => student.id === 2));
            // Test Case 8
            const result_TC8 = gradeExam(students, answerKey, submissions);

            result_TC8[0].score = 999;
            result_TC8[0].note = "điểm đánh giá thêm";

            console.log(result_TC8[0].score);
            console.log(result_TC8[0].note);
            // Test Case 9
            const result_TC9 = gradeExam(students, answerKey, submissions);

            const yen = result_TC9.find((student) => student.name === "Yen Vo");

            for (const question of new WrongAnswerIterator(yen)) {
                console.log(question);
            }
            // Test Case 10
            const students_TC10 = [];
            const answerKey_TC10 = [];
            const submissions_TC10 = [];

            console.log(gradeExam(students_TC10, answerKey_TC10, submissions_TC10));
        </script>
