<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài 1</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            #todo-app {
                width: 420px;
                background: #1e1e1e;
                padding: 20px;
                border-radius: 12px;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
            }

            #todo-list {
                list-style: none;
                margin-top: 20px;
            }

            #todo-list li {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: #2b2b2b;
                padding: 10px;
                border-radius: 6px;
                margin-bottom: 10px;
            }

            .completed span {
                text-decoration: line-through;
                opacity: 0.5;
            }

            #todo-count {
                margin-top: 20px;
            }
        </style>
    </head>
    <body>
        <div class="top-bar">
            <a href="index.html" class="back-btn">Quay lại</a>
        </div>

        <h1>Bài 1</h1>
        <div id="todo-app">
            <input type="text" id="todo-input" placeholder="Nhập việc cần làm..." />
            <button id="add-btn">Thêm</button>
            <ul id="todo-list"></ul>
            <p id="todo-count">Còn 0 việc chưa xong</p>
        </div>

        <script>
            const input = document.getElementById("todo-input");
            const addBtn = document.getElementById("add-btn");
            const todoList = document.getElementById("todo-list");
            const todoCount = document.getElementById("todo-count");

            // Cập nhật số việc chưa hoàn thành
            function updateCount() {
                let count = 0;

                for (let i = 0; i < todoList.children.length; i++) {
                    if (!todoList.children[i].classList.contains("completed")) {
                        count++;
                    }
                }

                todoCount.textContent = `Còn ${count} việc chưa xong`;
            }

            // Kiểm tra công việc đã tồn tại chưa
            function isDuplicate(text) {
                for (let i = 0; i < todoList.children.length; i++) {
                    const task = todoList.children[i].querySelector("span").textContent;

                    if (task === text) {
                        return true;
                    }
                }
                return false;
            }

            // Thêm công việc
            function addTodo() {
                const text = input.value.trim();

                if (text === "") {
                    return;
                }

                if (isDuplicate(text)) {
                    alert("Công việc đã tồn tại!");
                    input.value = "";
                    input.focus();
                    return;
                }

                const li = document.createElement("li");

                const span = document.createElement("span");
                span.textContent = text;

                const deleteBtn = document.createElement("button");
                deleteBtn.textContent = "Xóa";

                // Đánh dấu hoàn thành
                span.addEventListener("click", function () {
                    li.classList.toggle("completed");

                    if (li.classList.contains("completed")) {
                        span.style.textDecoration = "line-through";
                        span.style.opacity = "0.5";
                    } else {
                        span.style.textDecoration = "none";
                        span.style.opacity = "1";
                    }

                    updateCount();
                });

                // Xóa công việc
                deleteBtn.addEventListener("click", function () {
                    li.remove();
                    updateCount();
                });

                li.appendChild(span);
                li.appendChild(document.createTextNode(" "));
                li.appendChild(deleteBtn);

                todoList.appendChild(li);

                input.value = "";
                input.focus();

                updateCount();
            }

            // Click nút Thêm
            addBtn.addEventListener("click", addTodo);

            // Nhấn Enter
            input.addEventListener("keydown", function (e) {
                if (e.key === "Enter") {
                    addTodo();
                }
            });

            updateCount();
        </script>
    </body>
</html>
