<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Đăng ký - Music App</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body class="min-h-screen flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-md">
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold mt-2">Tạo tài khoản</h1>
                <p class="text-sm" style="color: var(--text-muted)">Đăng ký để bắt đầu nghe nhạc</p>
            </div>

            <div
                id="apiError"
                class="hidden bg-red-500/10 border border-red-500 text-red-400 text-sm rounded-lg px-4 py-3 mb-4 whitespace-pre-line"
            ></div>

            <form id="registerForm" class="space-y-4" novalidate>
                <div>
                    <label class="block text-sm font-medium mb-1">Tên đăng nhập</label>
                    <input
                        id="username"
                        type="text"
                        class="input-field w-full rounded-lg px-3 py-2 text-sm"
                        placeholder="vd: nguyenvana"
                    />
                    <p class="field-error hidden" data-error-for="username"></p>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input
                        id="email"
                        type="email"
                        class="input-field w-full rounded-lg px-3 py-2 text-sm"
                        placeholder="vd: ban@example.com"
                    />
                    <p class="field-error hidden" data-error-for="email"></p>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Mật khẩu</label>
                    <input
                        id="password"
                        type="password"
                        class="input-field w-full rounded-lg px-3 py-2 text-sm"
                        placeholder="Tối thiểu 6 ký tự"
                    />
                    <p class="field-error hidden" data-error-for="password"></p>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Tên hiển thị</label>
                    <input
                        id="display_name"
                        type="text"
                        class="input-field w-full rounded-lg px-3 py-2 text-sm"
                        placeholder="vd: Nguyễn Văn A"
                    />
                    <p class="field-error hidden" data-error-for="display_name"></p>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Giới thiệu</label>
                    <textarea
                        id="bio"
                        rows="2"
                        class="input-field w-full rounded-lg px-3 py-2 text-sm"
                        placeholder="Vài dòng về bạn..."
                    ></textarea>
                    <p class="field-error hidden" data-error-for="bio"></p>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Quốc gia</label>
                    <input
                        id="country"
                        type="text"
                        class="input-field w-full rounded-lg px-3 py-2 text-sm"
                        placeholder="vd: Việt Nam"
                    />
                    <p class="field-error hidden" data-error-for="country"></p>
                </div>

                <button id="submitBtn" type="submit" class="btn-primary w-full rounded-full py-2.5 text-sm mt-2">
                    Đăng ký
                </button>
            </form>

            <p class="text-center text-sm mt-6" style="color: var(--text-muted)">
                Đã có tài khoản? <a href="login.html" class="text-white font-semibold hover:underline">Đăng nhập</a>
            </p>
        </div>

        <script src="js/api.js"></script>
        <script src="js/register.js"></script>
    </body>
</html>
