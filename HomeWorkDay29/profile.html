<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Trang cá nhân - Music App</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body class="min-h-screen">
        <header class="sticky top-0 z-10 bg-black/90 backdrop-blur border-b border-neutral-800">
            <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="font-bold text-lg">Music App</span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="index.html" class="nav-link text-sm font-medium" style="color: var(--text-muted)"
                        >Trang chủ</a
                    >
                    <a href="profile.html" class="nav-link text-sm font-medium text-white">Cá nhân</a>
                    <button id="logoutBtn" class="btn-ghost text-sm font-medium px-4 py-1.5 rounded-full">
                        Đăng xuất
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-3xl mx-auto px-4 py-8">
            <div id="loadingState" class="flex items-center gap-3 py-10">
                <div class="spinner"></div>
                <span class="text-sm" style="color: var(--text-muted)">Đang tải thông tin cá nhân...</span>
            </div>

            <div
                id="errorState"
                class="hidden bg-red-500/10 border border-red-500 text-red-400 text-sm rounded-lg px-4 py-4"
            ></div>

            <div id="profileContent" class="hidden">
                <div class="flex items-center gap-5 mb-8">
                    <img id="profileAvatar" src="" alt="" class="w-24 h-24 avatar-circle bg-neutral-800" />
                    <div>
                        <h1 id="profileName" class="text-2xl font-bold"></h1>
                        <p id="profileUsername" class="text-sm" style="color: var(--text-muted)"></p>
                    </div>
                </div>

                <div class="media-card rounded-lg p-5 space-y-3 mb-6">
                    <h2 class="font-semibold text-lg mb-4">Thông tin cá nhân</h2>
                    <div class="grid grid-cols-3 gap-4 mb-6">
                        <div class="media-card rounded-lg p-5 text-center">
                            <p id="playlistCount" class="text-2xl font-bold">0</p>
                            <p class="text-sm mt-1" style="color: var(--text-muted)">Playlists</p>
                        </div>

                        <div class="media-card rounded-lg p-5 text-center">
                            <p id="followingCount" class="text-2xl font-bold">0</p>
                            <p class="text-sm mt-1" style="color: var(--text-muted)">Đang theo dõi</p>
                        </div>

                        <div class="media-card rounded-lg p-5 text-center">
                            <p id="playsCount" class="text-2xl font-bold">0</p>
                            <p class="text-sm mt-1" style="color: var(--text-muted)">Lượt nghe</p>
                        </div>
                    </div>
                    <div class="flex justify-between border-b border-neutral-800 pb-2">
                        <span style="color: var(--text-muted)">Email</span>
                        <span id="profileEmail" class="font-medium"></span>
                    </div>

                    <div class="flex justify-between border-b border-neutral-800 pb-2">
                        <span style="color: var(--text-muted)">ID</span>
                        <span id="profileId" class="font-medium text-sm"></span>
                    </div>

                    <div class="flex justify-between">
                        <span style="color: var(--text-muted)">Ngày tham gia</span>
                        <span id="profileCreatedAt" class="font-medium"></span>
                    </div>
                </div>

                <div id="extraFieldsWrap" class="hidden media-card rounded-lg p-5">
                    <p class="font-semibold mb-3">Thông tin khác</p>
                    <div id="extraFields" class="space-y-2 text-sm"></div>
                </div>
            </div>
        </main>

        <script src="js/api.js"></script>
        <script src="js/profile.js"></script>
    </body>
</html>
