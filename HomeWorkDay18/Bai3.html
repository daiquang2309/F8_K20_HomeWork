<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bài 2</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>Bài 3</h1>

        <a href="index.html">Quay lại</a>

        <script>
            const orders = [
                { id: 1, customer: "An", product: "Áo thun", category: "fashion", amount: 300000, status: "completed" },
                {
                    id: 2,
                    customer: "Bình",
                    product: "iPhone 15",
                    category: "electronics",
                    amount: 25000000,
                    status: "completed",
                },
                {
                    id: 3,
                    customer: "An",
                    product: "Quần jean",
                    category: "fashion",
                    amount: 450000,
                    status: "canceled",
                },
                {
                    id: 4,
                    customer: "Chi",
                    product: "Tai nghe",
                    category: "electronics",
                    amount: 1200000,
                    status: "completed",
                },
                { id: 5, customer: "Bình", product: "Giày", category: "fashion", amount: 900000, status: "pending" },
                {
                    id: 6,
                    customer: "An",
                    product: "Sạc dự phòng",
                    category: "electronics",
                    amount: 350000,
                    status: "completed",
                },
                {
                    id: 7,
                    customer: "Duy",
                    product: "Áo khoác",
                    category: "fashion",
                    amount: 600000,
                    status: "completed",
                },
            ];

            // Hàm 1
            function getRevenueByCategory(orders) {
                return orders.reduce((acc, order) => {
                    if (order.status !== "completed") {
                        return acc;
                    }

                    if (!acc[order.category]) {
                        acc[order.category] = 0;
                    }

                    acc[order.category] += order.amount;

                    return acc;
                }, {});
            }

            console.log(getRevenueByCategory(orders));

            // Hàm 2
            function getSpendingByCustomer(orders) {
                return orders.reduce((acc, order) => {
                    if (order.status !== "completed") {
                        return acc;
                    }

                    if (!acc[order.customer]) {
                        acc[order.customer] = 0;
                    }

                    acc[order.customer] += order.amount;

                    return acc;
                }, {});
            }

            console.log(getSpendingByCustomer(orders));
            // Hàm 3
            function getOrderCountByStatus(orders) {
                return orders.reduce((acc, order) => {
                    if (!acc[order.status]) {
                        acc[order.status] = 0;
                    }

                    acc[order.status]++;

                    return acc;
                }, {});
            }

            console.log(getOrderCountByStatus(orders));

            // Hàm 4
            function getTopCustomer(orders) {
                const result = orders.reduce(
                    (acc, order) => {
                        if (order.status !== "completed") {
                            return acc;
                        }

                        if (!acc.spending[order.customer]) {
                            acc.spending[order.customer] = 0;
                        }

                        acc.spending[order.customer] += order.amount;

                        if (acc.spending[order.customer] > acc.total) {
                            acc.total = acc.spending[order.customer];
                            acc.customer = order.customer;
                        }

                        return acc;
                    },
                    {
                        spending: {},
                        customer: "",
                        total: 0,
                    },
                );

                return {
                    customer: result.customer,
                    total: result.total,
                };
            }

            console.log(getTopCustomer(orders));
            // Hàm 5
            function getFullReport(orders) {
                return orders.reduce(
                    (acc, order) => {
                        // statusCount
                        if (!acc.statusCount[order.status]) {
                            acc.statusCount[order.status] = 0;
                        }
                        acc.statusCount[order.status]++;

                        // Chỉ xử lý completed
                        if (order.status !== "completed") {
                            return acc;
                        }

                        // revenueByCategory
                        if (!acc.revenueByCategory[order.category]) {
                            acc.revenueByCategory[order.category] = 0;
                        }
                        acc.revenueByCategory[order.category] += order.amount;

                        // spendingByCustomer
                        if (!acc.spendingByCustomer[order.customer]) {
                            acc.spendingByCustomer[order.customer] = 0;
                        }
                        acc.spendingByCustomer[order.customer] += order.amount;

                        // totalRevenue
                        acc.totalRevenue += order.amount;

                        return acc;
                    },
                    {
                        revenueByCategory: {},
                        spendingByCustomer: {},
                        statusCount: {},
                        totalRevenue: 0,
                    },
                );
            }

            console.log(getFullReport(orders));
        </script>
    </body>
</html>
